name: Build & Release Windows Worker

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "worker/**"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pyautogui pyperclip pillow

      - name: Build EXE (PyInstaller)
        run: |
          pyinstaller --onefile --noconsole --name local_worker_windows worker\local_worker_windows.py
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_worker_windows
          path: dist/local_worker_windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worker-latest
          name: Worker Latest
          draft: false
          prerelease: true
          files: |
            dist/local_worker_windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
